<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>شارك في المحاكمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f6f9;--surface:#fff;--ink:#14203a;--ink2:#45516b;--ink3:#5c6882;--line:#d8dce6;--accent:#b34a12;--on-accent:#fff;
  --tint:#eceff5;--tint2:#d9dfeb;--tintacc:#f3d9c7;--ok:#1f7a4d;--bad:#b3261e;--f:"Cairo","Segoe UI","Tahoma","DejaVu Sans",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0f1729;--surface:#162038;--ink:#eef0f6;--ink2:#b9c2d6;--ink3:#96a1ba;--line:#2a3552;
  --accent:#f08c4f;--on-accent:#1a0f08;--tint:#17223b;--tint2:#25335a;--tintacc:#5a3b2a;--ok:#5fd08f;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 var(--f);direction:rtl;min-height:100vh;
  padding-inline:max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-left));padding-block:env(safe-area-inset-top) env(safe-area-inset-bottom)}
h1,h2,h3,h4,p,ul{margin:0}ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.5rem 1.4rem;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:600;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:38px;padding:.25rem .9rem;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem}
.mut{color:var(--ink3)}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:.4rem;border-radius:99px;padding:.05rem .8rem;font-size:.82rem;font-weight:600;background:var(--tint);color:var(--ink2)}
.chip.live{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=text],input[type=email],input[type=password],input[type=url]{width:100%;min-height:48px;padding:.4rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);direction:ltr;text-align:start}
input[type=range]{width:100%;accent-color:var(--accent);height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:520px;margin:0 auto;padding-block:1rem 3rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.4rem 1.2rem}
.brand{font-weight:700;font-size:1.05rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;margin-inline-end:.4rem}
.dot.off{background:var(--bad)}
.state{font-size:.82rem;color:var(--ink3)}
h1{font-size:1.5rem;line-height:1.5;font-weight:700;margin-block:.3rem 1.2rem}
.big{font-size:3.4rem;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent);margin-block:.6rem 0}
.ends{display:flex;justify-content:space-between;color:var(--ink3);font-size:.9rem;margin-top:.2rem}
.band{text-align:center;font-weight:600;min-height:1.8em;margin-top:.4rem}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:start;min-height:54px;padding:.55rem 1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--tintacc)}
.opt[aria-pressed=true] .mk{border-color:var(--accent);background:radial-gradient(var(--accent) 0 45%,transparent 50%)}
.item{padding:1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:.8rem}
.item h3{font-size:1rem;font-weight:600;margin-bottom:.6rem}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.q{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;min-height:56px;padding:.4rem .7rem;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);text-align:start}
.q small{color:var(--ink3);font-size:.76rem;line-height:1.3}
.q[aria-pressed=true]{border-color:var(--accent);background:var(--tintacc)}
.send{width:100%;margin-top:1.2rem;min-height:56px;font-size:1.1rem}
.msg{margin-top:.9rem;font-size:.95rem;color:var(--bad);min-height:1.5em}
.center{text-align:center;padding-block:2.5rem 1rem}
.tick{width:72px;height:72px;border-radius:50%;margin:0 auto 1rem;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--tint2);border-top-color:var(--accent);margin:0 auto 1.2rem;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{background:none;border:0;padding:.3rem;color:var(--ink3);text-decoration:underline;font-size:.9rem}
.cfg{padding:1rem;border:1.5px dashed var(--bad);border-radius:14px;color:var(--bad)}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><span class="brand">محاكمة صورية</span><span class="state" id="conn" aria-live="polite"></span></header>
  <main id="app" aria-live="polite"></main>
</div>

<script src="config.js"></script>
<script src="activities.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';
  var CFG = window.MT_CONFIG || {};
  var app = document.getElementById('app'), connEl = document.getElementById('conn');

  // ---------- أدوات صغيرة ----------
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k]; if (v === false || v == null) return;
      if (k === 'class') e.className = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c == null) return; e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); });
    return e;
  }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function uuid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }); }
  function mount() { app.replaceChildren.apply(app, arguments); }
  function online(ok) { connEl.replaceChildren(h('span', { class: 'dot' + (ok ? '' : ' off') }), ok ? 'متصل' : 'انقطع الاتصال، نعيد المحاولة…'); }

  // ---------- الإعداد ----------
  if (!CFG.url || !CFG.anonKey || /YOUR-/.test(CFG.url + CFG.anonKey) || !window.supabase) {
    mount(h('p', { class: 'cfg' }, ['الصفحة غير مهيّأة بعد: عدّل الملف config.js وضع عنوان مشروع Supabase والمفتاح العام (anon / publishable).']));
    return;
  }
  var sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: false, autoRefreshToken: false } });

  // ---------- الحالة ----------
  var qs = new URLSearchParams(location.search);
  var state = {
    pin: (qs.get('p') || qs.get('pin') || ls('mt_pin') || '').trim(),
    device: ls('mt_device') || uuid(),
    round: null, sent: false
  };
  ls('mt_device', state.device);
  if (qs.get('p') || qs.get('pin')) { ls('mt_pin', state.pin); try { history.replaceState(null, '', location.pathname); } catch (e) { } }
  function done() { try { return JSON.parse(ls('mt_done') || '[]'); } catch (e) { return []; } }
  function markDone(id) { var d = done(); if (d.indexOf(id) < 0) d.push(id); ls('mt_done', JSON.stringify(d.slice(-40))); }

  // ---------- الشاشات ----------
  function viewPin(err) {
    var inp = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', maxlength: '12', 'aria-label': 'رمز الجلسة', placeholder: 'رمز الجلسة' });
    var go = function () { var v = inp.value.trim(); if (!v) return; state.pin = v; ls('mt_pin', v); state.round = null; poll(); view(); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    mount(h('section', { class: 'card' }, [
      h('p', { class: 'eyebrow' }, ['الانضمام']), h('h1', {}, ['أدخل رمز الجلسة الظاهر على الشاشة']),
      inp, h('p', { class: 'msg', role: 'alert' }, [err || '']),
      h('button', { class: 'btn pri send', type: 'button', onclick: go }, ['انضم'])
    ]));
    inp.focus();
  }
  function viewWait() {
    mount(h('section', { class: 'card center' }, [
      h('div', { class: 'spin', 'aria-hidden': 'true' }),
      h('h1', {}, ['بانتظار بدء النشاط']),
      h('p', { class: 'mut' }, ['ستظهر هنا الأسئلة تلقائياً حين يفتحها المقدّم. ابقَ على هذه الصفحة.']),
      h('p', {}, [h('button', { class: 'link', type: 'button', onclick: function () { ls('mt_pin', null); state.pin = ''; state.round = null; view(); } }, ['تغيير رمز الجلسة'])])
    ]));
  }
  function viewDone() {
    mount(h('section', { class: 'card center' }, [
      h('div', { class: 'tick', 'aria-hidden': 'true' }, [svgTick()]),
      h('h1', {}, ['وصلت إجابتك']),
      h('p', { class: 'mut' }, ['شكراً. انتظر النشاط التالي، وستنتقل الصفحة إليه تلقائياً.'])
    ]));
  }
  function svgTick() {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', '36'); s.setAttribute('height', '36');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M5 12.5l4.5 4.5L19 7.5'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor');
    p.setAttribute('stroke-width', '2.6'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
    s.appendChild(p); return s;
  }

  function viewRound() {
    var r = state.round, spec = r.spec || {}, value = null, ready = false;
    var msg = h('p', { class: 'msg', role: 'alert' });
    var btn = h('button', { class: 'btn pri send', type: 'button', disabled: true }, ['أرسل إجابتي']);
    var body;
    function setReady(v, ok) { value = v; ready = ok; btn.disabled = !ok; msg.textContent = ''; }

    if (r.type === 'scale') {
      var min = +spec.min, max = +spec.max; if (isNaN(min)) min = 0; if (isNaN(max)) max = 100;
      var out = h('div', { class: 'big', 'aria-hidden': 'true' }, ['—']);
      var band = h('div', { class: 'band' });
      var rg = h('input', { type: 'range', min: min, max: max, step: 1, value: Math.round((min + max) / 2), 'aria-label': r.title });
      var upd = function () {
        var n = +rg.value; out.textContent = n;
        var b = (spec.bands || []).filter(function (x) { return n >= x.from && n <= x.to; })[0];
        band.textContent = b ? b.label : '';
        setReady(n, true);
      };
      rg.addEventListener('input', upd);
      body = h('div', {}, [out, band, rg, h('div', { class: 'ends' }, [h('span', {}, [spec.minLabel || min]), h('span', {}, [spec.maxLabel || max])])]);
    } else if (r.type === 'choice') {
      var opts = (spec.options || []).map(function (t, i) {
        var b = h('button', { class: 'opt', type: 'button', 'aria-pressed': 'false' }, [h('span', { class: 'mk' }), h('span', {}, [t])]);
        b.addEventListener('click', function () {
          opts.forEach(function (o) { o.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); setReady(i, true);
        });
        return b;
      });
      body = h('div', { class: 'opts', role: 'group', 'aria-label': r.title }, opts);
    } else if (r.type === 'matrix') {
      var items = spec.items || [], quads = spec.quadrants || [], hints = spec.hints || [];
      var picks = items.map(function () { return null; });
      var cards = items.map(function (it, i) {
        var chips = quads.map(function (q, j) {
          var c = h('button', { class: 'q', type: 'button', 'aria-pressed': 'false' }, [h('b', {}, [q]), hints[j] ? h('small', {}, [hints[j]]) : null]);
          c.addEventListener('click', function () {
            picks[i] = j; Array.prototype.forEach.call(c.parentNode.children, function (x) { x.setAttribute('aria-pressed', 'false'); });
            c.setAttribute('aria-pressed', 'true');
            var all = picks.every(function (p) { return p !== null; });
            setReady(all ? picks.slice() : null, all);
          });
          return c;
        });
        return h('div', { class: 'item' }, [h('h3', {}, [it]), h('div', { class: 'quad', role: 'group', 'aria-label': it }, chips)]);
      });
      body = h('div', {}, cards);
    } else {
      body = h('p', { class: 'mut' }, ['نوع نشاط غير معروف.']);
    }

    btn.addEventListener('click', function () { if (ready) send(value, btn, msg); });
    mount(h('section', {}, [h('p', { class: 'eyebrow' }, ['النشاط']), h('h1', {}, [r.title]), body, msg, btn]));
  }

  // ---------- الإرسال ----------
  function send(v, btn, msg) {
    var rid = state.round.id; btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    sb.rpc('submit_response', { p_pin: state.pin, p_round: rid, p_device: state.device, p_payload: { v: v } }).then(function (res) {
      if (res.error) throw res.error;
      var code = res.data;
      if (code === 'ok' || code === 'duplicate') { markDone(rid); state.sent = true; view(); return; }
      btn.textContent = 'أرسل إجابتي';
      if (code === 'closed') { msg.textContent = 'انتهت هذه الجولة.'; poll(); }
      else if (code === 'forbidden') { ls('mt_pin', null); state.pin = ''; state.round = null; view('رمز الجلسة غير صحيح.'); }
      else if (code === 'full') { msg.textContent = 'اكتمل عدد المشاركين في هذه الجولة.'; }
      else { msg.textContent = 'تعذّر قبول الإجابة. حاول مرة أخرى.'; btn.disabled = false; }
    }).catch(function () { online(false); btn.disabled = false; btn.textContent = 'أرسل إجابتي'; msg.textContent = 'تعذّر الاتصال. إجابتك محفوظة هنا، اضغط للمحاولة مجدداً.'; });
  }

  // ---------- العرض والاستطلاع ----------
  function view(err) {
    if (!state.pin) return viewPin(err);
    if (!state.round) return viewWait();
    if (done().indexOf(state.round.id) >= 0) return viewDone();
    return viewRound();
  }
  var busy = false;
  function poll() {
    if (!state.pin || busy) return; busy = true;
    sb.rpc('get_open_round', { p_pin: state.pin }).then(function (res) {
      if (res.error) throw res.error;
      online(true);
      var r = (res.data && res.data[0]) || null;
      var changed = (!r && state.round) || (r && (!state.round || state.round.id !== r.id));
      state.round = r;
      if (changed) view();
    }).catch(function () { online(false); }).then(function () { busy = false; });
  }
  online(true); view(); poll();
  setInterval(poll, 3500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
