/* Layout concept: a quiet courtroom programme. One column of reading, wide
   bands for evidence and illustration. Ink navy + the university's rust. */
:root{
  --paper:#f5f6f9; --surface:#ffffff; --ink:#14203a; --ink2:#45516b; --ink3:#5c6882; --line:#d8dce6;
  --accent:#b34a12; --on-accent:#ffffff;
  --tint:#eceff5; --tint2:#d9dfeb; --tintacc:#f3d9c7; --paper-ill:#ffffff;
  --side-court:#14203a; --side-accuse:#b34a12; --side-defense:#2f56a6; --side-neutral:#8a94ab;
  --f-display:"Cairo","Segoe UI","DejaVu Sans","Tahoma",sans-serif;
  --f-body:"Cairo","Segoe UI","DejaVu Sans","Tahoma",sans-serif;
  --wrap:1100px; --read:46rem; --bar-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1729; --surface:#162038; --ink:#eef0f6; --ink2:#b9c2d6; --ink3:#96a1ba; --line:#2a3552;
    --accent:#f08c4f; --on-accent:#1a0f08;
    --tint:#17223b; --tint2:#25335a; --tintacc:#5a3b2a; --paper-ill:#1d2a49;
    --side-court:#eef0f6; --side-accuse:#f08c4f; --side-defense:#86a8f4; --side-neutral:#7d88a3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1729; --surface:#162038; --ink:#eef0f6; --ink2:#b9c2d6; --ink3:#96a1ba; --line:#2a3552;
  --accent:#f08c4f; --on-accent:#1a0f08;
  --tint:#17223b; --tint2:#25335a; --tintacc:#5a3b2a; --paper-ill:#1d2a49;
  --side-court:#eef0f6; --side-accuse:#f08c4f; --side-defense:#86a8f4; --side-neutral:#7d88a3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17.5px/1.95 var(--f-body);direction:rtl;text-align:start;
  font-synthesis:none;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------------------------------------------------------- top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:.5rem;height:var(--bar-h)}
.brand{display:inline-flex;align-items:center;gap:.6rem;font:700 1.25rem/1 var(--f-display);color:var(--ink);white-space:nowrap}
.brand .logo{height:38px}
.cur{flex:1;min-width:0;text-align:center;color:var(--ink3);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:.5rem}
.tb{display:inline-flex;align-items:center;gap:.4rem;height:38px;padding:0 .9rem;border-radius:999px;font-size:.92rem;font-weight:500;color:var(--ink);border:1px solid transparent}
.tb:hover{background:var(--tint)}
.tb[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.tb svg{width:18px;height:18px;flex:none}
.tb.on{border-color:var(--accent);color:var(--accent)}
.prog{height:2px;background:transparent}
.prog i{display:block;height:100%;width:0;background:var(--accent);transform-origin:right}
.panel{position:absolute;top:calc(var(--bar-h) + 8px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));width:min(26rem,calc(100vw - 32px));
  max-height:calc(100dvh - var(--bar-h) - 32px - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 50px rgba(10,20,40,.18);padding:1rem;z-index:70}
.panel h4{font:600 .8rem/1.4 var(--f-body);color:var(--ink3);margin:0 0 .6rem}
.idx a{display:flex;gap:.8rem;align-items:baseline;padding:.45rem .5rem;border-radius:8px;color:var(--ink);font-size:.98rem;line-height:1.6}
.idx a:hover,.idx a.cur-sec{background:var(--tint)}
.idx .n{font:700 .82rem var(--f-display);color:var(--accent);min-width:1.6rem;font-variant-numeric:tabular-nums}
.idx .d{margin-inline-start:auto;color:var(--ink3);font-size:.82rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .75rem;border:1px solid var(--line);border-radius:999px;font-size:.88rem;line-height:1.6;background:var(--surface)}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{color:var(--ink3);font-size:.78rem}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.dot{width:.55rem;height:.55rem;border-radius:50%;flex:none;background:var(--side-neutral)}
.dot.court{background:var(--side-court)} .dot.accuse{background:var(--side-accuse)} .dot.defense{background:var(--side-defense)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;color:var(--ink3);font-size:.82rem;margin-top:.8rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.dl-list{display:grid;gap:.5rem}
.dl-list button,.dl-list a{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;text-align:start;width:100%;font-size:.95rem}
.dl-list button:hover{border-color:var(--ink3);background:var(--tint)}
.dl-list small{color:var(--ink3);font-size:.8rem}

/* ---------------------------------------------------------------- buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;height:42px;padding:0 1.15rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.95rem;font-weight:500;line-height:1;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.sm{height:34px;padding:0 .85rem;font-size:.85rem}
.btn svg{width:17px;height:17px;flex:none}
.btn[aria-busy="true"]{opacity:.6;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:.6rem}

/* ---------------------------------------------------------------- sections */
.sec{padding-block:clamp(3.2rem,8vw,6rem) 1rem;scroll-margin-top:calc(var(--bar-h) + 6px)}
.sec + .sec{border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
.eyebrow{color:var(--accent);font-weight:600;font-size:.95rem;line-height:1.5;margin-bottom:.9rem;display:flex;flex-wrap:wrap;gap:.2rem .9rem}
.eyebrow .sep{color:var(--ink3);font-weight:400}
h2.t{font:700 clamp(2.5rem,6.2vw,4.4rem)/1.25 var(--f-display);text-wrap:balance;margin-bottom:1.2rem}
h2.t.long{font-size:clamp(2.1rem,4.6vw,3.3rem)}
.thesis{font:500 clamp(1.15rem,2.2vw,1.45rem)/1.7 var(--f-body);color:var(--ink);text-wrap:balance;max-width:26em;padding-top:1rem;position:relative}
.thesis::before{content:"";position:absolute;top:0;inset-inline-start:0;width:2.6rem;height:3px;background:var(--accent)}
.thesis.two{display:grid;gap:.5rem;max-width:none}
.thesis.two span{display:block}
.thesis.two em{font-style:normal;color:var(--ink3);font-size:.8em;margin-inline-end:.5rem}
.meta{color:var(--ink3);font-size:.95rem;margin-top:1rem}
.sec-head .btns{margin-top:1.6rem}
.ill{position:relative;border-radius:18px;overflow:hidden;background:var(--tint)}
.ill-svg{width:100%;height:auto;aspect-ratio:5/3;display:block}
.ill-svg .i-bg{fill:var(--tint)} .ill-svg .i-ink{fill:var(--ink)} .ill-svg .i-acc{fill:var(--accent)} .ill-svg .i-pap{fill:var(--paper-ill)}
.ill-svg .i-t1{fill:var(--tint2)} .ill-svg .i-t2{fill:var(--tintacc)} .ill-svg .i-mid{fill:var(--ink3)}
.ill-svg .i-inks{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ill-svg .i-accs{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ill-svg .i-mids{fill:none;stroke:var(--ink3);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ill-svg .i-pq{fill:var(--paper-ill);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.ill-svg .i-t1q{fill:var(--tint2);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.ill-svg .i-checks{fill:none;stroke:var(--paper-ill);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.ill-svg .i-num{fill:var(--ink);font:700 15px var(--f-body);text-anchor:middle;dominant-baseline:central}
.ill-svg .i-numw{fill:var(--on-accent);font:700 14px var(--f-body);text-anchor:middle;dominant-baseline:central}
.ill-dl{position:absolute;inset-block-end:.7rem;inset-inline-start:.7rem;display:flex;gap:.4rem;opacity:.0;transition:opacity .15s}
.ill:hover .ill-dl,.ill:focus-within .ill-dl{opacity:1}
@media (hover:none){.ill-dl{opacity:1}}
.ill-dl button{height:30px;padding:0 .7rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.78rem;font-weight:600;color:var(--ink)}
.ill-dl button:hover{border-color:var(--ink3)}

.band{margin-top:clamp(2.4rem,5vw,4rem)}
.band-t{font:600 .9rem/1.4 var(--f-body);color:var(--ink3);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.band-t::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1.6rem 1.8rem}
.ev li{border-top:2px solid var(--ink);padding-top:.8rem;min-width:0}
.ev .yr{font:700 2.5rem/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;margin-bottom:.5rem;min-height:2.5rem;display:flex;align-items:flex-end}
.ev .yr.none{font-size:1.5rem;color:var(--ink3)}
.ev b{display:block;font-weight:600;font-size:1rem;line-height:1.5;margin-bottom:.2rem}
.ev p{font-size:.93rem;line-height:1.75;color:var(--ink2)}
